# Nginx config for World Population Distribution.
# Put in /etc/nginx/sites-available/popmap, link it into sites-enabled, set server_name
# and then request a certificate:  sudo certbot --nginx -d yourdomain.com
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    root /var/www/popmap;
    index index.html;

    # tiles (~2.6 GB float32) compress by about 25%
    gzip on;
    gzip_comp_level 5;
    gzip_types application/octet-stream application/json application/javascript text/css;
    gzip_min_length 1024;

    # meta.json names the current dataset version; tile URLs carry ?v=<version>, so the
    # tiles themselves can be cached for a long time and still refresh after an update.
    # (tiles/ is a symlink to tiles-<version>/, swapped by deploy/update-data.sh.)
    location = /tiles/meta.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /tiles/ {
        types { application/octet-stream bin; application/json json; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /data/countries.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
